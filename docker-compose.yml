version: "3.8"
services:
  backend:
    build: ./backend
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    volumes:
      - ./backend:/backend
  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/frontend
    ports:
      - "3030:3000"
  database:
    build: ./fly.io/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "4321:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
