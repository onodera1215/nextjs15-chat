schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

input CreateInvitationInput {
  email: String
  inviteeUserId: String!
  roomId: String!
}

type CreateInvitationPayload {
  invitation: InvitationNode!
}

input CreateMessageInput {
  body: String!
  roomId: String!
}

type CreateMessagePayload {
  message: MessageNode!
}

input CreateRoomInput {
  description: String!
  name: String!
  status: RoomStatusEnum!
}

type CreateRoomPayload {
  room: RoomNode!
}

input CreateUserInput {
  email: String!
  icon: String!
  name: String!
  oauthProvider: String!
  oauthProviderAccountId: String!
}

type CreateUserPayload {
  user: UserNode!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type InvitationNode {
  createdAt: DateTime!
  email: String
  expiresAt: DateTime!
  id: ID!
  inviteeUserId: ID!
  inviterUserId: ID!
  roomId: ID!
  usedAt: DateTime
}

input JoinRoomInput {
  """招待経由の場合に使う"""
  invitationToken: String
  roomId: String!
  roomRoleId: RoomRole!
}

type JoinRoomPayload {
  membership: UserRoomNode!
  room: RoomNode!
}

input LeaveRoomInput {
  roomId: String!
}

type LeaveRoomPayload {
  room: RoomNode!
}

input MarkRoomReadInput {
  """最終既読日時（単調増加）"""
  lastReadAt: DateTime
  roomId: String!
}

type MarkRoomReadPayload {
  readState: RoomReadState!
}

type MessageConnection {
  edges: [MessageEdge!]!
  nodes: [MessageNode!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type MessageEdge {
  cursor: String!
  node: MessageNode!
}

type MessageNode {
  body: String!
  createdAt: DateTime!
  id: String!
  room: RoomNode!
  roomId: String!
  sender: UserNode!
  senderId: String!
  updatedAt: DateTime!
}

type Mutation {
  """招待用レコード作成"""
  createInvitation(input: CreateInvitationInput!): CreateInvitationPayload!
  createMessage(input: CreateMessageInput!): CreateMessagePayload!
  """ルーム新規作成"""
  createRoom(input: CreateRoomInput!): CreateRoomPayload!
  """ユーザー新規作成"""
  createUser(input: CreateUserInput!): CreateUserPayload!
  """ルーム参加"""
  joinRoom(input: JoinRoomInput!): JoinRoomPayload!
  """ルームメンバー退会"""
  leaveRoom(input: LeaveRoomInput!): LeaveRoomPayload!
  """既読処理実行"""
  markRoomRead(input: MarkRoomReadInput!): MarkRoomReadPayload!
}

type PageInfo {
  endCursor: String
  hasNextPage: Boolean!
}

type Query {
  """ログインユーザーの情報を取得します"""
  me: UserNode!
  messages(input: SearchMessagesInput!): MessageConnection!
  """所属しているルーム一覧取得"""
  myRooms(input: SearchRoomOptionInput): RoomConnection!
  """ユーザーが登録済みかどうかを判定します。"""
  registeredUser(input: RegisteredUserInput!): RegisteredUserModel!
  """ルーム取得"""
  room(id: String!): RoomNode
  """ルーム一覧取得"""
  rooms(input: SearchRoomOptionInput): RoomConnection!
  """指定したIDのユーザーを取得します。"""
  user(userId: String!): UserNode!
  """指定したemailを持つユーザーを取得します。"""
  userByEmail(email: String!): UserNode!
  """ユーザー一覧情報を取得します。"""
  users(input: SearchUsersInput): UserConnection!
}

input RegisteredUserInput {
  oauthProvider: String!
  oauthProviderAccountId: String!
}

type RegisteredUserModel {
  isRegistered: Boolean!
  isRegisteredInAnotherProvider: Boolean!
  user: UserNode
}

type RoomConnection {
  edges: [RoomEdge!]!
  nodes: [RoomNode!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type RoomEdge {
  cursor: String!
  node: RoomNode!
}

type RoomNode {
  createdAt: DateTime!
  description: String!
  id: ID!
  name: String!
  status: RoomStatusEnum!
  updatedAt: DateTime!
}

type RoomReadState {
  lastReadAt: DateTime!
  roomId: ID!
  """未読メッセージ数(厳密な数はqueryで取得すること)"""
  unreadCount: Int!
  userId: ID!
}

enum RoomRole {
  ROOM_MEMBER
  ROOM_OWNER
}

"""ルームステータス"""
enum RoomStatusEnum {
  ACTIVE
  INACTIVE
}

"""クエリ検索用オプション"""
input SearchMessagesInput {
  after: String
  roomId: String
  userId: String
}

input SearchRoomOptionInput {
  after: String
  createdAt: DateTime
  name: String
  roomId: String
  updatedAt: DateTime
  userId: String
}

"""ユーザー検索オプション"""
input SearchUsersInput {
  after: String
  """メールアドレスで部分一致検索"""
  email: String
  """名前で部分一致検索"""
  name: String
}

type Subscription {
  messageCreated: MessageNode!
  roomCreated: RoomNode!
  userSignedUp: UserNode!
}

type UserConnection {
  edges: [UserEdge!]!
  nodes: [UserNode!]!
  pageInfo: PageInfo!
  totalCount: Float!
}

type UserEdge {
  cursor: String!
  node: UserNode!
}

type UserNode {
  createdAt: DateTime!
  email: String!
  icon: String!
  id: ID!
  name: String!
  oauthProvider: String!
  oauthProviderAccountId: String!
  status: UserStatus!
  updatedAt: DateTime!
}

type UserRoomNode {
  joinViaUserId: String
  joinedAt: DateTime!
  role: RoomRole!
  roomId: String!
  userId: String!
}

"""ユーザーステータス"""
enum UserStatus {
  ACTIVE
  INACTIVE
}