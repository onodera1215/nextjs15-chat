schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

input CreateMessageInput {
  body: String!
  roomId: String!
  senderId: String!
}

input CreateRoomInput {
  description: String!
  name: String!
  status: RoomStatusEnum!
}

input CreateUserInput {
  email: String!
  name: String!
  oauthProvider: String!
  oauthProviderAccountId: String!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type MessageNode {
  body: String!
  createdAt: DateTime!
  id: String!
  room: RoomNode!
  roomId: String!
  sender: UserNode!
  senderId: String!
  updatedAt: DateTime!
}

type Mutation {
  createMessage(input: CreateMessageInput!): MessageNode!
  createRoom(input: CreateRoomInput!): RoomNode!
  createUser(input: CreateUserInput!): UserNode!
}

type Query {
  """ログインユーザーの情報を取得します"""
  me: UserNode!
  messages(input: SearchOptionInput!): [MessageNode!]!
  """ユーザーが登録済みかどうかを判定します。"""
  registeredUser(input: RegisteredUserInput!): RegisteredUserModel!
  rooms(input: SearchRoomOptionInput): [RoomNode!]!
  """指定したIDのユーザーを取得します。"""
  user(userId: String!): UserNode!
  """指定したemailを持つユーザーを取得します。"""
  userByEmail(email: String!): UserNode!
}

input RegisteredUserInput {
  oauthProvider: String!
  oauthProviderAccountId: String!
}

type RegisteredUserModel {
  isRegistered: Boolean!
  isRegisteredInAnotherProvider: Boolean!
}

type RoomNode {
  createdAt: DateTime!
  description: String!
  id: ID!
  name: String!
  status: RoomStatusEnum!
  updatedAt: DateTime!
}

"""ルームステータス"""
enum RoomStatusEnum {
  ACTIVE
  INACTIVE
}

"""クエリ検索用オプション"""
input SearchOptionInput {
  limit: Float
  offset: Float
  roomId: String!
}

input SearchRoomOptionInput {
  createdAt: DateTime
  name: String
  roomId: String
  updatedAt: DateTime
}

type Subscription {
  messageCreated: MessageNode!
  userSignedUp: UserNode!
}

type UserNode {
  createdAt: DateTime!
  email: String!
  id: ID!
  name: String!
  oauthProvider: String!
  oauthProviderAccountId: String!
  status: UserStatus!
  updatedAt: DateTime!
}

"""ユーザーステータス"""
enum UserStatus {
  ACTIVE
  INACTIVE
}