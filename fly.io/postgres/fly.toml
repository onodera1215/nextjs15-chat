# fly.toml app configuration file generated for postgres-long-sound-439 on 2025-07-12T18:08:40+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'postgres-long-sound-439'
primary_region = 'hkg'

[build]

[[mounts]]
  source = 'pg_data'
  destination = '/var/lib/postgresql/data'

[http_service]
  internal_port = 5432
  force_https = true
  auto_stop_machines = false 
  auto_start_machines = true
  min_machines_running = 1 

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
